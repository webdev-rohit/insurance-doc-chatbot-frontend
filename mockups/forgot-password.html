<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot password — Insurance Doc Chatbot</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="auth">
    <aside class="auth__aside">
      <a class="brand" href="index.html">
        <span class="brand__logo">🛡️</span>
        <span>Insurance Doc Chatbot</span>
      </a>
      <div class="auth__pitch">
        <h2>Forgot your password?</h2>
        <p>No problem. Enter your email and we’ll send you a token to reset it.</p>
      </div>
      <div class="auth__foot">© 2026 Insurance Doc Chatbot</div>
    </aside>

    <main class="auth__main">
      <div class="auth__card">
        <h1>Reset your password</h1>
        <p class="auth__sub">We’ll email a reset token to your registered address.</p>

        <form onsubmit="return false;">
          <div class="field">
            <label class="label" for="email">Email</label>
            <input class="input" id="email" type="email" placeholder="john.doe@example.com" value="john.doe@example.com" />
          </div>

          <button class="btn btn--primary btn--block" type="submit">Send reset token</button>
        </form>

        <p class="auth__alt">Remembered it? <a href="login.html">Back to sign in</a></p>
      </div>
    </main>
  </div>
</body>
</html>
